<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Counter App</title>

  <style>
    /* Reset and base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #f8fafc;
    }

    .counter-card {
      width: 100%;
      max-width: 420px;
      padding: 40px 30px;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin-bottom: 8px;
      font-size: 2rem;
      color: #38bdf8;
    }

    h2 {
      margin-bottom: 30px;
      font-size: 1.2rem;
      font-weight: 400;
      color: #cbd5e1;
    }

    #count {
      margin-bottom: 30px;
      font-size: 72px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    .button-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    button {
      padding: 13px 18px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background: #2563eb;
      cursor: pointer;
      transition: 0.25s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: #3b82f6;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35);
    }

    button:active {
      transform: translateY(0);
    }

    .action-button {
      background: #475569;
    }

    .action-button:hover {
      background: #64748b;
      box-shadow: 0 8px 18px rgba(71, 85, 105, 0.35);
    }

    .reset-button {
      background: #dc2626;
    }

    .reset-button:hover {
      background: #ef4444;
      box-shadow: 0 8px 18px rgba(220, 38, 38, 0.35);
    }

    @media (max-width: 400px) {
      .counter-card {
        padding: 30px 20px;
      }

      #count {
        font-size: 60px;
      }

      .button-group {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="counter-card">
    <h1>JavaScript Project</h1>
    <h2>Counter</h2>

    <p id="count">0</p>

    <div class="button-group">
      <button onclick="increaseCount()">+</button>
      <button onclick="decreaseCount()">−</button>
      <button class="reset-button" onclick="resetCount()">Reset</button>
      <button class="action-button" onclick="saveCount()">Save</button>
      <button class="action-button" onclick="loadCount()">Load</button>
    </div>
  </main>

  <script>
    let count = 0;

    function updateCount() {
      document.getElementById("count").textContent = count;
    }

    function increaseCount() {
      count++;
      updateCount();
    }

    function decreaseCount() {
      count--;
      updateCount();
    }

    function resetCount() {
      count = 0;
      updateCount();
    }

    function saveCount() {
      localStorage.setItem("count", count);
    }

    function loadCount() {
      const saved = localStorage.getItem("count");

      if (saved !== null) {
        count = Number(saved);
      }

      updateCount();
    }
  </script>
</body>
</html>
